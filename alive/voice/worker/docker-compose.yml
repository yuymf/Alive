# alive-voice worker 常驻容器编排（Step3-P2 / t_abbf56c0）
#
# 网络模型 = host，这是被依赖拓扑逼出来的唯一解，不是偷懒：
#   worker 主动连的 LiveKit:7880 / VoxCPM:8801 / sherpa:8802 / 通话页:8766
#   全部只绑宿主 127.0.0.1（实测经宿主非回环地址访问这四个端口全 REFUSED）；
#   bridge + ports 映射会让容器内 127.0.0.1 指向自己而连不上，
#   改生产服务绑定又违反「不干扰既有生产」硬门禁。host 下 127.0.0.1 即宿主，
#   所有 URL 零改动，且天然不占 docker 网络子网（绕开本机 43 个地址池坑）。
#
# 端口 = 实测空闲号 18081（切换前 ss 扫描 FREE）。host 网络无 NAT「发布」，
#   worker dev server 直接监听宿主 18081，故不写 ports；不抢 8081/7880/8801/
#   8802/8766/1234 任一生产号。
#
# 0 显存 + 白天不占卡：无 devices / device_requests / NVIDIA_VISIBLE_DEVICES /
#   runtime: nvidia，纯 runc；显式 cpus 4.0 + mem 2g（64 核机器的 6%）。
#
# 起：docker compose -f alive/voice/worker/docker-compose.yml up -d --build
# 重启（冷启动验收）：bash var/restart_agent.sh
# 回退到裸机 venv 的一行命令：见 alive/voice/start-all.sh 与 var/restart_agent.sh 头注释。
services:
  alive-voice-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: alive-voice-worker:local
    container_name: alive-voice-worker
    # 与宿主同 uid，写出的 /logs/agent.log 归宿主用户，harness 可 truncate/读增量。
    user: "1000:1000"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 25s
    # 本机配置随仓库走但含 LiveKit/LLM 凭据 —— 运行时 env_file 读入，
    # 绝不进镜像层、绝不进 git（.gitignore 已排除 alive/voice/voice.env）。
    env_file:
      - ../voice.env
    environment:
      # 覆盖 voice.env 的 8081：实测空闲号，切换前裸机 worker 仍占 8081。
      LIVEKIT_WORKER_PORT: "18081"
      AGENT_NAME: "alive-voice"
      SHERPA_WS_URL: "ws://127.0.0.1:8802/v1/stt/stream"
      SHERPA_PREFLIGHT: "0"                       # P1 结论：抢跑无效，保持默认关
      ALIVE_VAD_MIN_SILENCE: "${ALIVE_VAD_MIN_SILENCE:-0.35}"  # 单一真源，与 harness 同源
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Hong_Kong"                    # 日志时间戳对齐宿主，便于 harness/证据核对
    volumes:
      # 仅运行日志目录（非生产数据目录）；harness(latency_e2e.py) 读同一 inode 的增量。
      - ${HOME}/.alive/logs:/logs
      - /etc/localtime:/etc/localtime:ro
    # 关键：livekit-agents 1.8.12 每 job 起 runner/turn-detector/httpclient，
    # dockerd 默认 nofile=1024 会在首个 job 触发 EMFILE(_stt_pump 连 sherpa 失败)。
    # 裸机 worker 由 systemd 继承 nofile=4096 才够；容器内显式对齐并留余量。
    ulimits:
      nofile:
        soft: 8192
        hard: 1048576
    cpus: 4.0
    mem_limit: 2g
    healthcheck:
      # worker dev server GET / -> 200 OK（裸机 :8081 实测）；host 下 127.0.0.1 即自己。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
